<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#04102b" />
  <meta name="color-scheme" content="dark" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Alfaro" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Generador de frases del técnico Alfaro. Abrilo en Safari en iPad o iPhone." />
  <title>Generador de Frases del Técnico Alfaro</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="hero-card">
      <div class="stars" aria-hidden="true">
        <span>✦</span><span>✚</span><span>✦</span><span>✚</span>
      </div>

      <header class="header">
        <p class="kicker">Generador de</p>
        <h1>Frases</h1>
        <p class="subtitle">del técnico Alfaro</p>
      </header>

      <div class="coach-stage">
        <img
          src="assets/alfaro-8bit.png"
          alt="Ilustración 8-bit de un técnico de fútbol en conferencia de prensa"
          width="800"
          height="608"
          decoding="async"
        />
      </div>

      <article class="quote-box" aria-live="polite">
        <span class="quote-mark left" aria-hidden="true">“</span>
        <p id="quoteText">El fútbol es como un mate que hay que cebar despacio; si te apurás, lo terminás lavando.</p>
        <span class="quote-mark right" aria-hidden="true">”</span>
      </article>

      <div class="actions">
        <button type="button" id="newQuote" class="primary">↻ Nueva frase</button>
        <div class="secondary-actions">
          <button type="button" id="copyQuote">📋 Copiar</button>
          <button type="button" id="shareQuote">🔗 Compartir</button>
          <button type="button" id="speakQuote">🔊 Escuchar</button>
          <button type="button" id="favoriteQuote">♡ Favorita</button>
        </div>
      </div>

      <section class="info-card" id="infoCard">
        <div>
          <strong>Sabiduría Alfaro</strong>
          <p>Reflexiones, metáforas y enseñanzas de vida al estilo del Maestro. Pensado para Safari en iPad.</p>
        </div>
        <span class="trophy" aria-hidden="true">🏆</span>
      </section>

      <section class="favorites-panel" id="favoritesPanel">
        <h2>Favoritas</h2>
        <ul id="favoritesList"></ul>
        <button type="button" id="clearFavorites" class="ghost">Borrar favoritas</button>
      </section>

      <nav class="tabs" aria-label="Secciones">
        <button type="button" class="tab active" data-tab="quote">⚽ Frase</button>
        <button type="button" class="tab" data-tab="favorites">♡ Favoritas</button>
        <button type="button" class="tab" data-tab="info">ⓘ Info</button>
      </nav>

      <footer class="site-footer">
        <a href="https://instagram.com/roidelatorre" target="_blank" rel="noopener noreferrer">@roidelatorre</a>
      </footer>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
